name: DALE Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dale-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DALE-customized Termux debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_COMPILE_SDK: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '29.0.14206865'
      TERMUX_PACKAGE_VARIANT: apt-android-7
      TERMUX_APP_VERSION_NAME: 0.118.0-claude
      TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=2
        -Dorg.gradle.parallel=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "${SDK_ROOT}"

          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit 2>/dev/null || true)"
          if [[ -z "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "${SDKMANAGER}"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "$(dirname "${SDKMANAGER}")" >> "${GITHUB_PATH}"
          echo "Android SDK: ${SDK_ROOT}"
          echo "sdkmanager: ${SDKMANAGER}"

      - name: Install Android SDK/API 36, build-tools, and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}"             "platform-tools"             "platforms;android-${ANDROID_COMPILE_SDK}"             "build-tools;${ANDROID_BUILD_TOOLS}"             "ndk;${ANDROID_NDK_VERSION}"

          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_COMPILE_SDK}"
          test -d "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"
          test -f "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties"

      - name: Validate workflow inputs and pinned overlay
        shell: bash
        run: |
          set -euo pipefail
          test "${TERMUX_PACKAGE_VARIANT}" = "apt-android-7"
          test "${ANDROID_COMPILE_SDK}" = "36"
          test "${ANDROID_BUILD_TOOLS}" = "36.0.0"
          test "${ANDROID_NDK_VERSION}" = "29.0.14206865"
          test -f dale-android/source/dale-android-overlay.tar.gz
          gzip -t dale-android/source/dale-android-overlay.tar.gz
          tar -tzf dale-android/source/dale-android-overlay.tar.gz >/dev/null

      - name: Extract DALE build overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/dale-build"
          mkdir -p "${GITHUB_WORKSPACE}/dale-build"
          tar -xzf dale-android/source/dale-android-overlay.tar.gz -C "${GITHUB_WORKSPACE}/dale-build"
          test -d "${GITHUB_WORKSPACE}/dale-build/payload"
          chmod +x "${GITHUB_WORKSPACE}/dale-build/payload/scripts/"*.sh

      - name: Prepare pinned Termux source
        shell: bash
        run: |
          set -euo pipefail
          bash dale-build/payload/scripts/prepare-upstream.sh "${GITHUB_WORKSPACE}/termux-app"
          test -d "${GITHUB_WORKSPACE}/termux-app/app"
          test -f "${GITHUB_WORKSPACE}/termux-app/gradlew"
          echo "Upstream commit:"
          git -C "${GITHUB_WORKSPACE}/termux-app" rev-parse HEAD

      - name: Apply DALE overlay
        shell: bash
        run: |
          set -euo pipefail
          bash dale-build/payload/scripts/apply-overlay.sh "${GITHUB_WORKSPACE}/termux-app"
          bash dale-build/payload/scripts/verify-overlay.sh

      - name: Build debug APK
        working-directory: termux-app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleDebug -x lint --stacktrace

      - name: Collect APKs and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dale-android/artifacts
          find termux-app/app/build/outputs/apk/debug             -maxdepth 1 -type f -name '*.apk'             -print -exec cp {} dale-android/artifacts/ \;

          test -n "$(find dale-android/artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          (
            cd dale-android/artifacts
            sha256sum *.apk > SHA256SUMS
          )

          printf 'Generated APKs:\n'
          ls -lh dale-android/artifacts/*.apk
          cat dale-android/artifacts/SHA256SUMS

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: dale-termux-debug-apk
          path: |
            dale-android/artifacts/*.apk
            dale-android/artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
