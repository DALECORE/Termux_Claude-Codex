name: DALE Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dale-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DALE-customized Termux debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_COMPILE_SDK: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '29.0.14206865'
      TERMUX_PACKAGE_VARIANT: apt-android-7
      TERMUX_APP_VERSION_NAME: 0.118.0-claude
      TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=2
        -Dorg.gradle.parallel=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "${SDK_ROOT}"

          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit 2>/dev/null || true)"
          if [[ -z "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "${SDKMANAGER}"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "$(dirname "${SDKMANAGER}")" >> "${GITHUB_PATH}"
          echo "Android SDK: ${SDK_ROOT}"
          echo "sdkmanager: ${SDKMANAGER}"

      - name: Install Android SDK/API 36, build-tools, and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_COMPILE_SDK}"
          test -d "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"
          test -f "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/source.properties"

      - name: Rebuild and validate pinned DALE overlay
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY="${RUNNER_TEMP}/dale-android-overlay-min.tar.gz"
          cat dale-android/source/overlay.b64.part00 dale-android/source/overlay.b64.part01 | base64 --decode > "${OVERLAY}"
          printf '%s  %s\n' \
            '1adb1f9da3a00393e5cce63731ebbd86c326145bc0f14eb290fa5f7ddb2bd705' \
            "${OVERLAY}" | sha256sum -c -
          gzip -t "${OVERLAY}"
          tar -tzf "${OVERLAY}" >/dev/null

      - name: Extract DALE build overlay
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY="${RUNNER_TEMP}/dale-android-overlay-min.tar.gz"
          rm -rf "${GITHUB_WORKSPACE}/dale-build"
          mkdir -p "${GITHUB_WORKSPACE}/dale-build"
          tar -xzf "${OVERLAY}" -C "${GITHUB_WORKSPACE}/dale-build"
          test -d "${GITHUB_WORKSPACE}/dale-build/payload"
          chmod +x "${GITHUB_WORKSPACE}/dale-build/payload/scripts/"*.sh

      - name: Align overlay resource with pinned Termux source
        shell: bash
        run: |
          set -euo pipefail
          SHORTCUTS="${GITHUB_WORKSPACE}/dale-build/payload/overlay/app/src/main/res/xml/shortcuts.xml"
          sed -i 's/@drawable\/ic_launcher_foreground/@drawable\/ic_foreground/g' "${SHORTCUTS}"
          grep -q '@drawable/ic_foreground' "${SHORTCUTS}"
          ! grep -q '@drawable/ic_launcher_foreground' "${SHORTCUTS}"

      - name: Apply DALE Java compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          CODECHAT="${GITHUB_WORKSPACE}/dale-build/payload/overlay/app/src/main/java/com/termux/app/CodeChatActivity.java"
          sed -i 's/^[[:space:]]*View parent = fileRail.getParent()/        android.view.ViewGroup parent = fileRail.getParent()/' "${CODECHAT}"
          grep -q 'android.view.ViewGroup parent = fileRail.getParent()' "${CODECHAT}"

      - name: Prepare pinned Termux source
        shell: bash
        run: |
          set -euo pipefail
          bash dale-build/payload/scripts/prepare-upstream.sh "${GITHUB_WORKSPACE}/termux-app"
          test -d "${GITHUB_WORKSPACE}/termux-app/app"
          test -f "${GITHUB_WORKSPACE}/termux-app/gradlew"
          echo "Upstream commit:"
          git -C "${GITHUB_WORKSPACE}/termux-app" rev-parse HEAD

      - name: Apply DALE overlay
        shell: bash
        run: |
          set -euo pipefail
          bash dale-build/payload/scripts/apply-overlay.sh "${GITHUB_WORKSPACE}/termux-app"
          bash dale-build/payload/scripts/verify-overlay.sh

      - name: Install DALE 3D shell as the real app home
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE}/termux-app/app/src/main"
          PKG="${ROOT}/java/com/termux/app"
          mkdir -p "${PKG}"

          cat > "${PKG}/DaleLauncherActivity.java" <<'JAVA'
package com.termux.app;

import android.app.Activity;
import android.app.AlertDialog;
import android.content.Intent;
import android.graphics.*;
import android.net.Uri;
import android.os.Bundle;
import android.provider.Settings;
import android.view.*;
import java.util.Locale;

public final class DaleLauncherActivity extends Activity {
    private DaleHome home;

    @Override public void onCreate(Bundle state) {
        super.onCreate(state);
        getWindow().setStatusBarColor(Color.rgb(3,6,12));
        getWindow().setNavigationBarColor(Color.rgb(3,6,12));
        home = new DaleHome();
        setContentView(home);
    }

    private void open(String id) {
        try {
            if ("terminal".equals(id)) {
                Intent i = new Intent(this, TermuxActivity.class);
                i.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP);
                startActivity(i);
            } else if ("code".equals(id)) {
                startActivity(new Intent(this, CodeChatActivity.class));
            } else if ("workspace".equals(id)) {
                Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                startActivityForResult(i, 44);
            } else if ("settings".equals(id)) {
                startActivity(new Intent(Settings.ACTION_SETTINGS));
            } else if ("lanie".equals(id)) {
                startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("http://127.0.0.1:8080")));
            } else {
                new AlertDialog.Builder(this)
                    .setTitle(id.toUpperCase(Locale.US))
                    .setMessage("DALE capability: " + id + "\n\nThe shell is implemented; this capability is not falsely reported as connected to a backend.")
                    .setPositiveButton("OK", null).show();
            }
        } catch (Exception e) {
            new AlertDialog.Builder(this).setTitle("DALE").setMessage("Could not open " + id + ": " + e.getMessage()).setPositiveButton("OK", null).show();
        }
    }

    private final class DaleHome extends View {
        final Paint p=new Paint(3), s=new Paint(3);
        final String[] ids={"workspace","terminal","code","lanie","rag","voice","vision","git","settings"};
        final String[] names={"WORKSPACE","TERMINAL","CODE","LANIE","RAG","VOICE","VISION","GIT","SETTINGS"};
        final String[] desc={"files + projects","shell runtime","agent editor","local AI","retrieval","whisper","camera","repositories","android"};
        float downX,downY,spin=0; int selected=0;

        DaleHome(){super(DaleLauncherActivity.this);s.setStyle(Paint.Style.STROKE);setFocusable(true);}

        @Override protected void onDraw(Canvas c) {
            int w=getWidth(),h=getHeight();
            c.drawColor(Color.rgb(3,6,12));
            p.setShader(new LinearGradient(0,0,w,h,Color.rgb(7,17,30),Color.rgb(2,4,9),Shader.TileMode.CLAMP));
            c.drawRect(0,0,w,h,p);p.setShader(null);
            s.setColor(Color.argb(34,99,230,255));s.setStrokeWidth(1);
            for(int i=-10;i<12;i++){float x=w/2+i*68+spin*.15f;c.drawLine(x,h*.54f,w/2+(x-w/2)*2.7f,h,s);}
            for(int i=0;i<7;i++){float y=h*.56f+i*i*13;c.drawLine(0,y,w,y,s);}

            p.setColor(Color.WHITE);p.setTypeface(Typeface.DEFAULT_BOLD);p.setTextSize(22);c.drawText("DALE",24,42,p);
            p.setColor(Color.rgb(99,230,255));p.setTextSize(10);c.drawText("LOCAL • AGENT • WORKSPACE",24,61,p);
            p.setTextAlign(Paint.Align.RIGHT);p.setColor(Color.rgb(150,170,185));p.setTextSize(9);c.drawText("DALE CORE / 3D SHELL",w-20,40,p);p.setTextAlign(Paint.Align.LEFT);

            float cx=w/2,cy=h*.40f,r=Math.min(w,h)*.105f;
            p.setShader(new RadialGradient(cx-r*.25f,cy-r*.25f,r,new int[]{Color.rgb(120,245,255),Color.rgb(12,60,78),Color.rgb(3,8,14)},null,Shader.TileMode.CLAMP));
            c.drawCircle(cx,cy,r,p);p.setShader(null);
            s.setColor(Color.argb(180,99,230,255));s.setStrokeWidth(2);c.drawCircle(cx,cy,r*1.3f,s);
            p.setTextAlign(Paint.Align.CENTER);p.setColor(Color.WHITE);p.setTypeface(Typeface.DEFAULT_BOLD);p.setTextSize(15);c.drawText("DALE CORE",cx,cy+5,p);
            p.setTypeface(Typeface.DEFAULT);p.setTextSize(8);p.setColor(Color.rgb(130,215,235));c.drawText("CONTROL PLANE",cx,cy+r+20,p);

            float orbit=Math.min(w,h)*.34f;
            for(int i=0;i<ids.length;i++){
                double a=Math.toRadians(i*40-160+spin*.05f);
                float x=cx+(float)Math.cos(a)*orbit,y=cy+(float)Math.sin(a)*orbit*.72f;
                float depth=(float)Math.cos(a),scale=.70f+.30f*((depth+1)/2f)+(i==selected?.08f:0);
                float cw=112*scale,ch=66*scale;
                RectF rr=new RectF(x-cw/2,y-ch/2,x+cw/2,y+ch/2);
                p.setColor(Color.argb(i==selected?235:185,8,15,25));c.drawRoundRect(rr,12,12,p);
                s.setColor(i==selected?Color.rgb(99,230,255):Color.argb(85,110,150,170));s.setStrokeWidth(i==selected?2.2f:1);c.drawRoundRect(rr,12,12,s);
                p.setTextAlign(Paint.Align.LEFT);p.setTypeface(Typeface.DEFAULT_BOLD);p.setTextSize(10*scale);p.setColor(i==selected?Color.rgb(99,230,255):Color.rgb(180,195,208));c.drawText(names[i],rr.left+10*scale,rr.top+22*scale,p);
                p.setTypeface(Typeface.DEFAULT);p.setTextSize(7.5f*scale);p.setColor(Color.rgb(120,138,153));c.drawText(desc[i],rr.left+10*scale,rr.top+39*scale,p);
                p.setColor(i==selected?Color.rgb(99,230,255):Color.rgb(65,90,105));c.drawCircle(rr.left+12*scale,rr.bottom-11*scale,3*scale,p);
            }

            p.setColor(Color.argb(225,4,7,13));c.drawRect(0,h-82,w,h,p);
            p.setTextAlign(Paint.Align.CENTER);p.setTypeface(Typeface.DEFAULT_BOLD);p.setTextSize(11);p.setColor(Color.rgb(99,230,255));c.drawText(names[selected],w/2,h-52,p);
            p.setTypeface(Typeface.DEFAULT);p.setTextSize(9);p.setColor(Color.rgb(145,160,175));c.drawText(desc[selected]+" • TAP TO OPEN • SWIPE",w/2,h-33,p);
            p.setTextAlign(Paint.Align.LEFT);
        }

        @Override public boolean onTouchEvent(MotionEvent e) {
            if(e.getAction()==MotionEvent.ACTION_DOWN){downX=e.getX();downY=e.getY();return true;}
            if(e.getAction()==MotionEvent.ACTION_UP){
                float dx=e.getX()-downX;
                if(Math.abs(dx)>60){selected=Math.floorMod(selected+(dx>0?-1:1),ids.length);spin+=dx>0?40:-40;invalidate();return true;}
                float cx=getWidth()/2,cy=getHeight()*.40f,orbit=Math.min(getWidth(),getHeight())*.34f;
                int hit=-1;float best=Float.MAX_VALUE;
                for(int i=0;i<ids.length;i++){double a=Math.toRadians(i*40-160+spin*.05f);float x=cx+(float)Math.cos(a)*orbit,y=cy+(float)Math.sin(a)*orbit*.72f,d=(x-e.getX())*(x-e.getX())+(y-e.getY())*(y-e.getY());if(d<best&&d<20000){best=d;hit=i;}}
                if(hit>=0){selected=hit;invalidate();open(ids[selected]);}
                else if(e.getY()>getHeight()-105)open(ids[selected]);
                return true;
            }
            return true;
        }
    }
}
JAVA

          MANIFEST="${ROOT}/AndroidManifest.xml"
          python3 - "${MANIFEST}" <<'PY'
from pathlib import Path
import sys
p=Path(sys.argv[1]); s=p.read_text()
launcher='''            <intent-filter>
                <action android:name="android.intent.action.MAIN" />

                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>'''
if launcher not in s:
    raise SystemExit("Termux launcher filter not found")
s=s.replace(launcher,"",1)
anchor='''        <activity
            android:name=".app.TermuxActivity"'''
insert='''        <activity
            android:name=".app.DaleLauncherActivity"
            android:exported="true"
            android:screenOrientation="portrait"
            android:theme="@style/Theme.TermuxActivity.DayNight.NoActionBar">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>

'''
s=s.replace(anchor,insert+anchor,1)
p.write_text(s)
PY
          grep -q 'android:name=".app.DaleLauncherActivity"' "${MANIFEST}"
          grep -q 'DaleLauncherActivity.java' <(printf '%s\n' "${PKG}/DaleLauncherActivity.java")
          ! grep -A4 -B1 'android:name=".app.TermuxActivity"' "${MANIFEST}" | grep -q 'category android:name="android.intent.category.LAUNCHER"'
          echo "DALE 3D shell is the sole Android launcher entry point."

      - name: Build debug APK
        working-directory: termux-app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleDebug -x lint --stacktrace

      - name: Collect APKs and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dale-android/artifacts
          find termux-app/app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' \
            -print -exec cp {} dale-android/artifacts/ \;

          test -n "$(find dale-android/artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          (
            cd dale-android/artifacts
            sha256sum *.apk > SHA256SUMS
          )

          printf 'Generated APKs:\n'
          ls -lh dale-android/artifacts/*.apk
          cat dale-android/artifacts/SHA256SUMS

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: dale-termux-debug-apk
          path: |
            dale-android/artifacts/*.apk
            dale-android/artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
